<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *{ box-sizing:border-box; }
    body{ margin:0; }
    a{ color:#9a8d3a; } a:hover{ color:#7d7230; }
  </style>
</helmet>

<div style="width:390px; height:1300px; background:#f3f4f0; font-family:'Inter',system-ui,sans-serif; display:flex; flex-direction:column; overflow:hidden;">

  <!-- Top bar -->
  <div style="flex:none; background:#ffffff; border-bottom:1px solid #e6e7e1; padding:15px 18px; display:flex; align-items:center; justify-content:space-between;">
    <button style="width:32px; height:32px; border:none; background:#f3f4f0; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#585a4f;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <div style="font-family:'Playfair Display',serif; font-size:19px; font-weight:600; color:#2e302a;">Filtros</div>
    <button style="border:none; background:transparent; color:#9a3b3b; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; padding:0;">Limpar tudo</button>
  </div>

  <!-- Corpo -->
  <div style="flex:1; min-height:0; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:20px;">

    <!-- Listas -->
    <div>
      <div style="font-size:10.5px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:#9a9c90; margin-bottom:10px;">Listas</div>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <button style="display:flex; align-items:center; gap:7px; height:36px; padding:0 13px; border-radius:12px; background:#f4f1d4; border:1.5px solid #c5b54a; color:#857727; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;"><span style="width:8px; height:8px; border-radius:50%; background:#c5b54a;"></span>Prioridade</button>
        <button style="display:flex; align-items:center; gap:7px; height:36px; padding:0 13px; border-radius:12px; background:#ffffff; border:1px solid #e2e3dd; color:#4a4d43; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;"><span style="width:8px; height:8px; border-radius:50%; background:#a4739a;"></span>Seleção Especial</button>
        <button style="display:flex; align-items:center; gap:7px; height:36px; padding:0 13px; border-radius:12px; background:#ffffff; border:1px solid #e2e3dd; color:#4a4d43; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;"><span style="width:8px; height:8px; border-radius:50%; background:#8a8fa8;"></span>Gaveta</button>
      </div>
    </div>

    <!-- Bairro -->
    <div>
      <div style="font-size:10.5px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:#9a9c90; margin-bottom:10px;">Bairro</div>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <button style="height:36px; padding:0 13px; border-radius:12px; background:#585a4f; border:1px solid #585a4f; color:#f3f4f0; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;">Ipanema</button>
        <button style="height:36px; padding:0 13px; border-radius:12px; background:#585a4f; border:1px solid #585a4f; color:#f3f4f0; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;">Leblon</button>
        <button style="height:36px; padding:0 13px; border-radius:12px; background:#ffffff; border:1px solid #e2e3dd; color:#4a4d43; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;">Botafogo</button>
        <button style="height:36px; padding:0 13px; border-radius:12px; background:#ffffff; border:1px solid #e2e3dd; color:#4a4d43; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;">Copacabana</button>
        <button style="height:36px; padding:0 13px; border-radius:12px; background:#ffffff; border:1px solid #e2e3dd; color:#4a4d43; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;">Flamengo</button>
        <button style="height:36px; padding:0 13px; border-radius:12px; background:#ffffff; border:1px solid #e2e3dd; color:#4a4d43; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;">Jardim Botânico</button>
        <button style="height:36px; padding:0 13px; border-radius:12px; background:#ffffff; border:1px dashed #c8cac1; color:#6e7063; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;">+ 4 bairros</button>
      </div>
    </div>

    <!-- Valor de venda -->
    <div>
      <div style="font-size:10.5px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:#9a9c90; margin-bottom:10px;">Valor de venda</div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="flex:1; background:#ffffff; border:1px solid #e2e3dd; border-radius:13px; padding:10px 13px;">
          <div style="font-size:10px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:#9a9c90;">Mínimo</div>
          <div style="font-size:15px; font-weight:600; color:#2e302a; margin-top:3px;">R$ 1.000.000</div>
        </div>
        <span style="color:#b0b2a8; font-size:14px;">—</span>
        <div style="flex:1; background:#ffffff; border:1px solid #e2e3dd; border-radius:13px; padding:10px 13px;">
          <div style="font-size:10px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:#9a9c90;">Máximo</div>
          <div style="font-size:15px; font-weight:400; color:#b0b2a8; margin-top:3px;">Sem limite</div>
        </div>
      </div>
    </div>

    <!-- Metragem -->
    <div>
      <div style="font-size:10.5px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:#9a9c90; margin-bottom:10px;">Metragem</div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="flex:1; background:#ffffff; border:1px solid #e2e3dd; border-radius:13px; padding:10px 13px;">
          <div style="font-size:10px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:#9a9c90;">Mínima</div>
          <div style="font-size:15px; font-weight:600; color:#2e302a; margin-top:3px;">100 m²</div>
        </div>
        <span style="color:#b0b2a8; font-size:14px;">—</span>
        <div style="flex:1; background:#ffffff; border:1px solid #e2e3dd; border-radius:13px; padding:10px 13px;">
          <div style="font-size:10px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:#9a9c90;">Máxima</div>
          <div style="font-size:15px; font-weight:400; color:#b0b2a8; margin-top:3px;">Sem limite</div>
        </div>
      </div>
    </div>

    <!-- Cômodos -->
    <div>
      <div style="font-size:10.5px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:#9a9c90; margin-bottom:10px;">Mínimos</div>
      <div style="display:flex; flex-direction:column; gap:1px; background:#eef0ea; border:1px solid #eef0ea; border-radius:13px; overflow:hidden;">
        <div style="background:#fff; padding:12px 14px; display:flex; align-items:center; justify-content:space-between;">
          <span style="font-size:14px; color:#3d3f36; font-weight:500;">Quartos</span>
          <div style="display:flex; align-items:center; gap:6px;">
            <button style="width:30px; height:30px; border:1px solid #e2e3dd; background:#fff; border-radius:9px; color:#888b7e; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;">−</button>
            <span style="min-width:24px; text-align:center; font-size:15px; font-weight:700; color:#2e302a;">2</span>
            <button style="width:30px; height:30px; border:1px solid #e2e3dd; background:#fff; border-radius:9px; color:#585a4f; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;">+</button>
          </div>
        </div>
        <div style="background:#fff; padding:12px 14px; display:flex; align-items:center; justify-content:space-between;">
          <span style="font-size:14px; color:#3d3f36; font-weight:500;">Suítes</span>
          <div style="display:flex; align-items:center; gap:6px;">
            <button style="width:30px; height:30px; border:1px solid #e2e3dd; background:#fff; border-radius:9px; color:#c8cac1; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;">−</button>
            <span style="min-width:24px; text-align:center; font-size:15px; font-weight:400; color:#b0b2a8;">—</span>
            <button style="width:30px; height:30px; border:1px solid #e2e3dd; background:#fff; border-radius:9px; color:#585a4f; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;">+</button>
          </div>
        </div>
        <div style="background:#fff; padding:12px 14px; display:flex; align-items:center; justify-content:space-between;">
          <span style="font-size:14px; color:#3d3f36; font-weight:500;">Vagas</span>
          <div style="display:flex; align-items:center; gap:6px;">
            <button style="width:30px; height:30px; border:1px solid #e2e3dd; background:#fff; border-radius:9px; color:#888b7e; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;">−</button>
            <span style="min-width:24px; text-align:center; font-size:15px; font-weight:700; color:#2e302a;">1</span>
            <button style="width:30px; height:30px; border:1px solid #e2e3dd; background:#fff; border-radius:9px; color:#585a4f; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;">+</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Período de entrada -->
    <div>
      <div style="font-size:10.5px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:#9a9c90; margin-bottom:10px;">Período de entrada</div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="flex:1; background:#ffffff; border:1px solid #e2e3dd; border-radius:13px; padding:10px 13px; display:flex; align-items:center; gap:9px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#888b7e" strokeWidth="1.9" strokeLinecap="round"><rect x="3" y="5" width="18" height="16" rx="2.5"></rect><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          <span style="font-size:14px; font-weight:600; color:#2e302a;">01/07</span>
        </div>
        <span style="color:#b0b2a8; font-size:14px;">—</span>
        <div style="flex:1; background:#ffffff; border:1px solid #e2e3dd; border-radius:13px; padding:10px 13px; display:flex; align-items:center; gap:9px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#888b7e" strokeWidth="1.9" strokeLinecap="round"><rect x="3" y="5" width="18" height="16" rx="2.5"></rect><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          <span style="font-size:14px; font-weight:600; color:#2e302a;">Hoje</span>
        </div>
      </div>
    </div>

    <!-- Situação -->
    <div>
      <div style="font-size:10.5px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:#9a9c90; margin-bottom:10px;">Situação</div>
      <div style="display:flex; flex-direction:column; gap:1px; background:#eef0ea; border:1px solid #eef0ea; border-radius:13px; overflow:hidden;">

        <label style="background:#fff; padding:12px 14px; display:flex; align-items:center; gap:11px; cursor:pointer;">
          <span style="width:20px; height:20px; border-radius:6px; background:#585a4f; border:1px solid #585a4f; display:flex; align-items:center; justify-content:center; flex:none;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f3f4f0" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
          <span style="font-size:14px; color:#3d3f36; font-weight:500;">Sem agendamento</span>
        </label>

        <label style="background:#fff; padding:12px 14px; display:flex; align-items:center; gap:11px; cursor:pointer;">
          <span style="width:20px; height:20px; border-radius:6px; background:#fff; border:1px solid #d0d1cb; flex:none;"></span>
          <span style="font-size:14px; color:#3d3f36; font-weight:500;">Com visita agendada</span>
        </label>

        <label style="background:#fff; padding:12px 14px; display:flex; align-items:center; gap:11px; cursor:pointer;">
          <span style="width:20px; height:20px; border-radius:6px; background:#fff; border:1px solid #d0d1cb; flex:none;"></span>
          <span style="font-size:14px; color:#3d3f36; font-weight:500;">Com gravação agendada</span>
        </label>

        <label style="background:#fff; padding:12px 14px; display:flex; align-items:center; gap:11px; cursor:pointer;">
          <span style="width:20px; height:20px; border-radius:6px; background:#fff; border:1px solid #d0d1cb; flex:none;"></span>
          <span style="font-size:14px; color:#3d3f36; font-weight:500;">Já gravada</span>
        </label>

        <label style="background:#fff; padding:12px 14px; display:flex; align-items:center; gap:11px; cursor:pointer;">
          <span style="width:20px; height:20px; border-radius:6px; background:#585a4f; border:1px solid #585a4f; display:flex; align-items:center; justify-content:center; flex:none;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f3f4f0" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
          <span style="font-size:14px; color:#3d3f36; font-weight:500;">Não gravada</span>
        </label>

        <label style="background:#fff; padding:12px 14px; display:flex; align-items:center; gap:11px; cursor:pointer;">
          <span style="width:20px; height:20px; border-radius:6px; background:#fff; border:1px solid #d0d1cb; flex:none;"></span>
          <span style="font-size:14px; color:#3d3f36; font-weight:500;">Já cadastrada no sistema</span>
        </label>

        <label style="background:#fff; padding:12px 14px; display:flex; align-items:center; gap:11px; cursor:pointer;">
          <span style="width:20px; height:20px; border-radius:6px; background:#fff; border:1px solid #d0d1cb; flex:none;"></span>
          <span style="font-size:14px; color:#3d3f36; font-weight:500;">Paradas há 3+ dias</span>
        </label>

      </div>
    </div>

  </div>

  <!-- Rodapé fixo -->
  <div style="flex:none; background:#ffffff; border-top:1px solid #e6e7e1; padding:13px 18px 18px; display:flex; align-items:center; gap:11px; box-shadow:0 -6px 20px -12px rgba(46,48,42,0.2);">
    <button style="flex:none; padding:14px 18px; border:1px solid #e2e3dd; background:#fff; border-radius:14px; color:#6e7063; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer;">Limpar</button>
    <button style="flex:1; padding:14px; border:none; background:linear-gradient(150deg,#e0d27a,#c5b54a); color:#3a3408; border-radius:14px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; box-shadow:0 10px 24px -10px rgba(157,141,58,0.6);">Ver 17 captações</button>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
